<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>MarinerAI - Maritime & Seafarer Operations Assistant</title>
    <meta name="description" content="Specialized AI assistant and knowledge base for seafarers, mariners, captains, and engineers based on MAR-KB-001." />
    
    <!-- Native App & PWA Capabilities -->
    <meta name="theme-color" content="#0c0d0e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MarinerAI" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="MarinerAI - Maritime & Seafarer Operations Assistant" />
    <meta property="og:description" content="Specialized AI assistant and knowledge base for seafarers, mariners, captains, and engineers based on MAR-KB-001." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- App Icons & Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
  </head>
  <body class="overscroll-none select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
