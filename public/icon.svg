<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d0e"/>
      <stop offset="100%" stop-color="#181a20"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle for native app icon -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer subtle navigational ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ring)" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ring)" stroke-width="1.5"/>

  <!-- Compass Cardinal Ticks -->
  <line x1="256" y1="72" x2="256" y2="88" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="424" x2="256" y2="440" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="72" y1="256" x2="88" y2="256" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="424" y1="256" x2="440" y2="256" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Glowing Anchor Icon (Native Maritime Theme) -->
  <g filter="url(#glow)">
    <!-- Top Ring -->
    <circle cx="256" cy="148" r="28" fill="none" stroke="url(#accent)" stroke-width="18"/>
    
    <!-- Central Shank -->
    <line x1="256" y1="176" x2="256" y2="370" stroke="url(#accent)" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Stock (Crossbar) -->
    <line x1="184" y1="210" x2="328" y2="210" stroke="url(#accent)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="184" cy="210" r="8" fill="#38bdf8"/>
    <circle cx="328" cy="210" r="8" fill="#38bdf8"/>

    <!-- Bottom Flukes / Crown -->
    <path d="M 140 290 C 140 395, 372 395, 372 290" fill="none" stroke="url(#accent)" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Fluke Arrowheads -->
    <path d="M 124 305 L 140 270 L 156 305 Z" fill="#38bdf8"/>
    <path d="M 356 305 L 372 270 L 388 305 Z" fill="#38bdf8"/>
  </g>
</svg>
